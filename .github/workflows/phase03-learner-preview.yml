name: Phases 03-27 learner qualification

on:
  pull_request:
    paths:
      - "apps/learner/**"
      - "tests/phase03-learner-model.test.mjs"
      - "tests/phase04-teaching.test.mjs"
      - "tests/phase05-player-state.test.mjs"
      - "tests/phase06-exercises.test.mjs"
      - "tests/phase07-practice.test.mjs"
      - "tests/phase08-independent-transfer.test.mjs"
      - "tests/phase09-writing-revision.test.mjs"
      - "tests/phase11-draft-guard.test.mjs"
      - "tests/phase12-source-contrast.test.mjs"
      - "tests/phase13-independent-depth.test.mjs"
      - "tests/phase14-source-coverage.test.mjs"
      - "tests/phase15-multi-lesson.test.mjs"
      - "tests/phase16-source-evidence.test.mjs"
      - "tests/phase17-cross-source.test.mjs"
      - "tests/phase18-next-source.test.mjs"
      - "tests/phase19-application-paths.test.mjs"
      - "tests/phase20-writing-review.test.mjs"
      - "tests/phase21-source-followups.test.mjs"
      - "tests/phase22-source-intake.test.mjs"
      - "tests/phase23-french-authoring.test.mjs"
      - "tests/phase24-japanese-authoring.test.mjs"
      - "tests/phase25-chinese-authoring.test.mjs"
      - "tests/phase26-chinese-depth.test.mjs"
      - "tests/phase27-chinese-transfer.test.mjs"
      - "apps/learner/src/phase27-chinese-transfer.ts"
      - "apps/learner/src/phase26-chinese-depth.ts"
      - "apps/learner/src/phase25-chinese-authoring.ts"
      - "apps/learner/src/phase24-japanese-authoring.ts"
      - "apps/learner/src/phase23-french-authoring.ts"
      - "apps/learner/src/source-intake.ts"
      - "scripts/ecosystem-inventory.mjs"
      - "languages/chinese/preflight.ts"
      - "contracts/fixtures/phase18-next-source-lessons.json"
      - "contracts/fixtures/phase17-cross-source-lessons.json"
      - "contracts/phase16-source-evidence.json"
      - "contracts/fixtures/phase15-source-lessons.json"
      - "contracts/fixtures/phase02-source-lessons.json"
      - "packages/content-schema/src/lesson-v1.ts"
      - ".github/workflows/phase03-learner-preview.yml"
  push:
    paths:
      - "apps/learner/**"
      - "tests/phase03-learner-model.test.mjs"
      - ".github/workflows/phase03-learner-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-learner-preview:
    runs-on: ubuntu-latest
    # Exact Playwright browser version with WebKit, Firefox and Chromium system libraries.
    # Avoids the Ubuntu hosted runner's missing WebKit libraries and hanging apt installs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Shared lesson model tests without dependencies
        run: node --experimental-strip-types --test tests/phase03-learner-model.test.mjs tests/phase04-teaching.test.mjs tests/phase05-player-state.test.mjs tests/phase06-exercises.test.mjs tests/phase07-practice.test.mjs tests/phase08-independent-transfer.test.mjs tests/phase09-writing-revision.test.mjs tests/phase11-draft-guard.test.mjs tests/phase12-source-contrast.test.mjs tests/phase13-independent-depth.test.mjs tests/phase14-source-coverage.test.mjs tests/phase15-multi-lesson.test.mjs tests/phase16-source-evidence.test.mjs tests/phase17-cross-source.test.mjs tests/phase18-next-source.test.mjs tests/phase19-application-paths.test.mjs tests/phase20-writing-review.test.mjs tests/phase21-source-followups.test.mjs tests/phase22-source-intake.test.mjs tests/phase23-french-authoring.test.mjs tests/phase24-japanese-authoring.test.mjs tests/phase25-chinese-authoring.test.mjs tests/phase26-chinese-depth.test.mjs tests/phase27-chinese-transfer.test.mjs tests/phase02-lesson-contract.test.mjs
      - name: Install only public preview dependencies, not the Hub's private Account package
        working-directory: apps/learner
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Typecheck and build isolated learner preview
        working-directory: apps/learner
        run: npm run build
      - name: Chromium Firefox WebKit desktop and mobile learning journey
        working-directory: apps/learner
        # GitHub maps /github/home to pwuser while the Playwright container runs as root.
        # Firefox requires HOME to be owned by the actual browser-launch user.
        env:
          HOME: /root
        run: npm run test:e2e
      - name: Assert candidate did not overwrite Hub output
        run: |
          test -f dist/learner-preview/index.html
          test ! -d dist/hub
          test ! -e dist/learner-preview/release.json

  root-compatibility:
    # Draft-PR root verification: the existing root CI intentionally skips draft PRs.
    # Run its real commands independently, without changing the release gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install original monorepo dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run original monorepo verification
        run: pnpm verify
      - name: Build original consumer package
        run: pnpm package:consumer
