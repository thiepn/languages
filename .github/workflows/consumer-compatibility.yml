name: Consumer compatibility watch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  consumer-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-consumer-compatibility.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
