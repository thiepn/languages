name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  verify:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || github.head_ref == 'feature/shared-visual-lexicon-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm verify
      - run: pnpm package:consumer

  package-consumer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm package:consumer
      - uses: actions/upload-artifact@v4
        with:
          name: thiepn-languages-0.11.0
          path: artifacts/*.tgz
