name: CUR-01 Six-Level Contract
on:
  push:
    branches:
      - feature/cur01-six-level-curriculum-20261026
permissions:
  contents: read
concurrency:
  group: cur01-languages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/curriculum.test.ts tests/level-catalog.test.ts
      - run: pnpm build:hub
